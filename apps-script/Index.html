<!DOCTYPE html>
<html lang="ja">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <style>
    :root { color-scheme: light; --bg:#f5f5f4; --card:#fff; --ink:#171717; --muted:#737373; --line:#e5e5e5; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:var(--bg); color:var(--ink); }
    main { max-width:520px; margin:0 auto; padding:20px 16px 42px; }
    h1 { font-size:26px; margin:6px 0 4px; }
    .sub { margin:0 0 18px; color:var(--muted); font-size:14px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:18px; padding:16px; margin:12px 0; box-shadow:0 4px 18px rgba(0,0,0,.04); }
    .label { display:block; font-size:12px; font-weight:700; margin-bottom:8px; color:#525252; }
    .seg { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .seg input { display:none; }
    .seg label { text-align:center; padding:13px 10px; border:1px solid var(--line); border-radius:12px; font-weight:700; background:#fafafa; }
    .seg input:checked + label { background:#171717; color:#fff; border-color:#171717; }
    input[type="file"], input[type="date"], input[type="number"], input[type="text"] { width:100%; border:1px solid var(--line); border-radius:12px; padding:13px 12px; background:#fff; font-size:16px; }
    button { width:100%; border:0; border-radius:14px; padding:15px 14px; font-size:16px; font-weight:800; background:#171717; color:#fff; cursor:pointer; }
    button.secondary { background:#e5e5e5; color:#171717; }
    button:disabled { opacity:.45; cursor:default; }
    .grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .field { margin:12px 0; }
    .status { font-size:14px; line-height:1.55; margin-top:12px; color:#525252; }
    .warn { background:#fff7ed; border:1px solid #fed7aa; color:#9a3412; padding:10px 12px; border-radius:12px; font-size:13px; margin-top:10px; }
    .ok { background:#ecfdf5; border:1px solid #a7f3d0; color:#065f46; padding:12px; border-radius:12px; font-size:14px; margin-top:10px; }
    .tabs { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:12px; }
    .tabs button { background:#e5e5e5; color:#171717; padding:12px; }
    .tabs button.active { background:#171717; color:#fff; }
    select { width:100%; border:1px solid var(--line); border-radius:12px; padding:12px; background:#fff; font-size:16px; }
    .kpi { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px; }
    .kpi div { background:#fafafa; border:1px solid var(--line); border-radius:12px; padding:12px; }
    .kpi .k { font-size:12px; color:var(--muted); }
    .kpi .v { font-size:22px; font-weight:800; margin-top:4px; }
    .kpi .v.minus { color:#b91c1c; }
    .kpi .big { grid-column:1 / -1; background:#ecfdf5; border-color:#a7f3d0; }
    table { width:100%; border-collapse:collapse; font-size:14px; margin-top:8px; }
    td { padding:8px 4px; border-bottom:1px solid var(--line); vertical-align:top; }
    td.r { text-align:right; white-space:nowrap; }
    .tag { display:inline-block; font-size:11px; padding:2px 7px; border-radius:999px; background:#e5e5e5; margin-right:6px; }
    .tag.s { background:#dbeafe; }
    .tag.y { background:#fce7f3; }
    .hidden { display:none; }
    .tiny { font-size:12px; color:var(--muted); margin-top:8px; }
  </style>
</head>
<body>
<main>
  <h1>📸 家計簿</h1>
  <p class="sub">レシート登録 / お金の動き</p>

  <div class="tabs">
    <button id="tabReg" type="button" class="active" onclick="showTab('reg')">登録</button>
    <button id="tabView" type="button" onclick="showTab('view')">お金の動き</button>
  </div>

  <div id="viewPane" class="hidden">
    <section class="card">
      <span class="label">月を選ぶ</span>
      <select id="monthSelect" onchange="loadSummary(this.value)"></select>
      <div id="viewStatus" class="status"></div>
      <div id="summary" class="hidden">
        <div class="kpi">
          <div class="big"><div class="k">貯金に回せる額（今月の余り）</div><div id="kLeftover" class="v"></div></div>
          <div><div class="k">翔平 受け取り</div><div id="kReceive" class="v"></div></div>
          <div><div class="k">予算</div><div id="kBudget" class="v"></div></div>
          <div><div class="k">ゆみこ 支出合計</div><div id="kYumiko" class="v"></div></div>
          <div><div class="k">翔平 支出合計</div><div id="kShohei" class="v"></div></div>
          <div class="big" style="background:#fafafa;border-color:var(--line)"><div class="k">差額</div><div id="kDiff" class="v"></div><div id="kDiffNote" class="tiny"></div></div>
        </div>
        <div id="savings" class="tiny"></div>
      </div>
    </section>

    <section id="fixedCard" class="card hidden">
      <span class="label">固定費</span>
      <table id="fixedTable"></table>
    </section>

    <section id="entriesCard" class="card hidden">
      <span class="label">明細（新しい順）</span>
      <table id="entriesTable"></table>
    </section>
  </div>

  <div id="regPane">
  <form id="receiptForm" class="card" onsubmit="analyze(this); return false;">
    <span class="label">誰が払った？</span>
    <div class="seg">
      <input id="payerY" type="radio" name="payer" value="ゆみこ" checked>
      <label for="payerY">ゆみこ</label>
      <input id="payerS" type="radio" name="payer" value="翔平">
      <label for="payerS">翔平</label>
    </div>

    <div class="field">
      <span class="label">レシート</span>
      <input id="receipt" name="receipt" type="file" accept="image/*" capture="environment" required>
      <div class="tiny">スマホでは「写真を撮る」を選べます。</div>
    </div>

    <button id="readBtn" type="submit">レシートを読み取る</button>
    <div id="readStatus" class="status"></div>
  </form>

  <section id="resultCard" class="card hidden">
    <span class="label">読み取り結果</span>

    <div class="grid">
      <div class="field">
        <span class="label">日付</span>
        <input id="date" type="date">
      </div>
      <div class="field">
        <span class="label">合計金額</span>
        <input id="amount" type="number" min="1" inputmode="numeric">
      </div>
    </div>

    <div class="field">
      <span class="label">店名・内容</span>
      <input id="description" type="text" placeholder="例：ヨーカドー">
    </div>

    <div id="warning" class="warn hidden"></div>
    <div id="target" class="tiny"></div>
    <button id="saveBtn" type="button" onclick="save()">家計簿に登録</button>
    <div id="saveStatus" class="status"></div>
  </section>
  </div>
</main>

<script>
  let current = null;

  function analyze(form) {
    const btn = document.getElementById('readBtn');
    const status = document.getElementById('readStatus');
    btn.disabled = true;
    status.textContent = '読み取り中…';
    document.getElementById('resultCard').classList.add('hidden');

    google.script.run
      .withSuccessHandler(data => {
        current = data;
        document.getElementById('date').value = data.date || '';
        document.getElementById('amount').value = data.amount || '';
        document.getElementById('description').value = data.description || '';
        document.getElementById('target').textContent = '登録先予定：' + data.detectedSheet + ' タブ / ' + data.payer;

        const warning = document.getElementById('warning');
        if (data.warning) {
          warning.textContent = data.warning;
          warning.classList.remove('hidden');
        } else {
          warning.classList.add('hidden');
        }

        document.getElementById('resultCard').classList.remove('hidden');
        status.textContent = '読み取り完了。内容だけ確認してください。';
        btn.disabled = false;
        window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
      })
      .withFailureHandler(err => {
        status.textContent = 'エラー：' + (err && err.message ? err.message : err);
        btn.disabled = false;
      })
      .analyzeReceipt(form);
  }

  function save() {
    if (!current) return;
    const btn = document.getElementById('saveBtn');
    const status = document.getElementById('saveStatus');
    btn.disabled = true;
    status.textContent = '登録中…';

    const payload = {
      payer: current.payer,
      date: document.getElementById('date').value,
      amount: document.getElementById('amount').value,
      description: document.getElementById('description').value,
      receiptFileId: current.receiptFileId,
      receiptUrl: current.receiptUrl
    };

    google.script.run
      .withSuccessHandler(res => {
        status.innerHTML = '<div class="ok">' + escapeHtml(res.message) + '</div>';
        btn.disabled = false;
        document.getElementById('receiptForm').reset();
        document.getElementById('payerY').checked = true;
        current = null;
        monthsLoaded = false;
        setTimeout(() => {
          document.getElementById('resultCard').classList.add('hidden');
          document.getElementById('readStatus').textContent = '';
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }, 1500);
      })
      .withFailureHandler(err => {
        status.textContent = 'エラー：' + (err && err.message ? err.message : err);
        btn.disabled = false;
      })
      .saveReceipt(payload);
  }


  /* ---------- 閲覧 ---------- */
  let monthsLoaded = false;
  let currentMonth = null;

  function showTab(name) {
    document.getElementById('regPane').classList.toggle('hidden', name !== 'reg');
    document.getElementById('viewPane').classList.toggle('hidden', name !== 'view');
    document.getElementById('tabReg').classList.toggle('active', name === 'reg');
    document.getElementById('tabView').classList.toggle('active', name === 'view');
    if (name === 'view' && !monthsLoaded) loadMonths();
  }

  function loadMonths() {
    const status = document.getElementById('viewStatus');
    status.textContent = '読み込み中…';
    google.script.run
      .withSuccessHandler(res => {
        monthsLoaded = true;
        const sel = document.getElementById('monthSelect');
        sel.innerHTML = '';
        res.sheets.forEach(n => {
          const o = document.createElement('option');
          o.value = n; o.textContent = monthLabel(n);
          sel.appendChild(o);
        });
        sel.value = res.current;
        loadSummary(res.current);
      })
      .withFailureHandler(err => { status.textContent = 'エラー：' + (err && err.message ? err.message : err); })
      .listMonthSheets();
  }

  function loadSummary(name) {
    currentMonth = name;
    const status = document.getElementById('viewStatus');
    status.textContent = '読み込み中…';
    google.script.run
      .withSuccessHandler(d => {
        status.textContent = '';
        document.getElementById('summary').classList.remove('hidden');
        setMoney('kLeftover', d.leftover);
        setMoney('kReceive', d.shoheiReceive);
        setMoney('kBudget', d.budget);
        setMoney('kYumiko', d.yumikoTotal);
        setMoney('kShohei', d.shoheiTotal);
        setMoney('kDiff', d.diff);
        document.getElementById('kDiffNote').textContent =
          d.diff > 0 ? '翔平が ' + yen(d.diff) + ' 多く払っている' :
          d.diff < 0 ? 'ゆみこが ' + yen(-d.diff) + ' 多く払っている' : '同額';

        const sv = document.getElementById('savings');
        sv.textContent = d.savings
          ? '余り金の累計残高：' + yen(d.savings.balance) + '（' + d.savings.year + '年' + d.savings.month + '時点）'
          : '';

        const ft = document.getElementById('fixedTable');
        ft.innerHTML = d.fixed.map(f =>
          '<tr><td>' + escapeHtml(f.label) + '</td><td class="r">' + yen(f.amount) + '</td></tr>').join('');
        document.getElementById('fixedCard').classList.toggle('hidden', d.fixed.length === 0);

        const et = document.getElementById('entriesTable');
        et.innerHTML = d.entries.length
          ? d.entries.map(e =>
              '<tr><td><span class="tag ' + (e.payer === '翔平' ? 's' : 'y') + '">' + escapeHtml(e.payer) + '</span>' +
              escapeHtml(e.date) + '</td><td>' + escapeHtml(e.description || '') + '</td><td class="r">' + yen(e.amount) + '</td></tr>').join('')
          : '<tr><td>まだ登録がありません</td></tr>';
        document.getElementById('entriesCard').classList.remove('hidden');
      })
      .withFailureHandler(err => { status.textContent = 'エラー：' + (err && err.message ? err.message : err); })
      .getMonthSummary(name);
  }

  function setMoney(id, v) {
    const el = document.getElementById(id);
    el.textContent = v === null || v === undefined ? '—' : yen(v);
    el.classList.toggle('minus', typeof v === 'number' && v < 0);
  }
  function yen(v) { return '¥' + Math.round(Number(v) || 0).toLocaleString('ja-JP'); }
  function monthLabel(n) {
    const m = String(n).match(/^(\d{2})(\d{1,2})$/);
    return m ? '20' + m[1] + '年' + Number(m[2]) + '月' : n;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
  }
</script>
</body>
</html>
