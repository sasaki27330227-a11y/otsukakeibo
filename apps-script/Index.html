<!DOCTYPE html>
<html lang="ja">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <style>
    :root { color-scheme: light; --bg:#F2EFE8; --card:#FAF8F3; --ink:#232A3D; --navy:#232A3D; --red:#9A4A3A; --yellow:#E3D9C2; --muted:#7A7F8C; --line:#232A3D; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:"Helvetica Neue",Helvetica,Arial,"Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif; background:var(--bg); color:#1f2340;
      background-image:radial-gradient(rgba(35,42,61,.05) 1px, transparent 1px); background-size:14px 14px; }
    main { max-width:520px; margin:0 auto; padding:14px 16px 60px; }
    .eyebrow { margin:0; color:var(--muted); font-size:11px; letter-spacing:.2em; font-weight:800; }
    h1 { font-size:30px; line-height:1.1; margin:2px 0 4px; color:var(--navy); letter-spacing:.04em; font-weight:900; white-space:nowrap; }
    .sub { margin:0 0 16px; color:var(--muted); font-size:10px; letter-spacing:.22em; text-transform:uppercase; font-weight:800; }
    .card { background:var(--card); border:2px solid var(--navy); border-radius:6px; padding:16px; margin:14px 0; box-shadow:3px 3px 0 var(--navy); }
    .label { display:block; font-size:11px; font-weight:900; margin-bottom:8px; color:var(--navy); letter-spacing:.18em; text-transform:uppercase; }
    .seg { display:grid; grid-template-columns:1fr 1fr; gap:0; border:2px solid var(--navy); border-radius:999px; overflow:hidden; }
    .seg input { display:none; }
    .seg label { text-align:center; padding:12px 10px; font-weight:900; background:var(--card); color:var(--navy); letter-spacing:.1em; }
    .seg label + input + label { border-left:2px solid var(--navy); }
    .seg input:checked + label { background:var(--navy); color:#F2EFE8; }
    input[type="file"], input[type="date"], input[type="number"], input[type="text"] { width:100%; min-width:0; max-width:100%; display:block; -webkit-appearance:none; appearance:none; min-height:48px; border:2px solid var(--navy); border-radius:6px; padding:12px; background:#fff; font-size:16px; color:#1f2340; }
    input:focus { outline:none; box-shadow:0 0 0 3px var(--yellow); border-color:var(--navy); }
    button { width:100%; border:2px solid var(--navy); border-radius:999px; padding:14px; font-size:15px; font-weight:900; letter-spacing:.12em; background:var(--navy); color:#F2EFE8; cursor:pointer; }
    button.secondary { background:var(--card); color:var(--navy); }
    button:disabled { opacity:.45; cursor:default; }
    .grid { display:grid; grid-template-columns:1fr; gap:0; }
    .grid > * { min-width:0; }
    .field { margin:12px 0; }
    .status { font-size:13px; line-height:1.55; margin-top:12px; color:var(--muted); }
    .warn { background:#F1EAD8; border:2px solid var(--yellow); color:#6A5A3A; padding:10px 12px; border-radius:6px; font-size:13px; margin-top:10px; }
    .ok { background:var(--navy); color:#F2EFE8; padding:12px; border-radius:6px; font-size:14px; margin-top:10px; font-weight:800; }
    .tiny { font-size:12px; color:var(--muted); margin-top:8px; }
    .tabs { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:6px; }
    .tabs button { background:var(--card); color:var(--navy); padding:12px; border-radius:6px; box-shadow:3px 3px 0 var(--navy); }
    .tabs button.active { background:var(--navy); color:#F2EFE8; }
    select { width:100%; border:2px solid var(--navy); border-radius:6px; padding:12px; background:#fff; font-size:16px; color:var(--navy); font-weight:800; }
    .kpi { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px; }
    .kpi div { background:#fff; border:2px solid var(--navy); border-radius:6px; padding:12px; }
    .kpi .k { font-size:10px; color:var(--navy); letter-spacing:.14em; text-transform:uppercase; font-weight:900; }
    .kpi .v { font-family:"Helvetica Neue",Helvetica,Arial,"Hiragino Sans",sans-serif; font-size:24px; font-weight:800; margin-top:4px; color:var(--navy); font-variant-numeric:tabular-nums; }
    .kpi .v.minus { color:var(--red); }
    .kpi .big { grid-column:1 / -1; background:var(--yellow); }
    .kpi .big .v { font-size:32px; }
    table { width:100%; border-collapse:collapse; font-size:14px; margin-top:8px; }
    td { padding:9px 4px; border-bottom:1px dashed rgba(35,42,61,.3); vertical-align:top; }
    td.r { text-align:right; white-space:nowrap; font-weight:800; color:var(--navy); font-variant-numeric:tabular-nums; }
    .tag { display:inline-block; font-size:10px; padding:2px 8px; border-radius:999px; border:1.5px solid var(--navy); color:var(--navy); margin-right:6px; font-weight:900; letter-spacing:.08em; }
    .tag.s { background:var(--navy); color:#F2EFE8; }
    .tag.y { background:var(--red); border-color:var(--red); color:#F2EFE8; }
    button.del { width:auto; padding:4px 10px; font-size:11px; letter-spacing:.05em; background:#fff; color:var(--red); border:1.5px solid var(--red); border-radius:999px; margin-left:6px; }
    .stripes { height:2px; background:var(--navy); margin:0 0 16px; }
    .hidden { display:none; }
  </style>
</head>
<body>
<main>
  <div class="tabs">
    <button id="tabReg" type="button" class="active" onclick="showTab('reg')">登録</button>
    <button id="tabView" type="button" onclick="showTab('view')">お金の動き</button>
  </div>

  <div id="viewPane" class="hidden">
    <section class="card">
      <span class="label">Month — 月を選ぶ</span>
      <select id="monthSelect" onchange="loadSummary(this.value)"></select>
      <div id="viewStatus" class="status"></div>
      <div id="summary" class="hidden">
        <div class="kpi">
          <div class="big"><div class="k">Savings — 貯金に回せる額</div><div id="kLeftover" class="v"></div></div>
          <div><div class="k">翔平 受け取り</div><div id="kReceive" class="v"></div></div>
          <div><div class="k">予算</div><div id="kBudget" class="v"></div></div>
          <div><div class="k">ゆみこ 支出合計</div><div id="kYumiko" class="v"></div></div>
          <div><div class="k">翔平 支出合計</div><div id="kShohei" class="v"></div></div>
          <div class="big" style="background:#fff"><div class="k">Balance — 差額</div><div id="kDiff" class="v"></div><div id="kDiffNote" class="tiny"></div></div>
        </div>
        <div id="savings" class="tiny"></div>
      </div>
    </section>

    <section id="fixedCard" class="card hidden">
      <span class="label">Fixed — 固定費</span>
      <table id="fixedTable"></table>
    </section>

    <section id="entriesCard" class="card hidden">
      <span class="label">Entries — 明細（新しい順）</span>
      <table id="entriesTable"></table>
    </section>
  </div>

  <div id="regPane">
  <form id="receiptForm" class="card" onsubmit="analyze(this); return false;">
    <span class="label">Who paid — 誰が払った？</span>
    <div class="seg">
      <input id="payerY" type="radio" name="payer" value="ゆみこ" checked>
      <label for="payerY">ゆみこ</label>
      <input id="payerS" type="radio" name="payer" value="翔平">
      <label for="payerS">翔平</label>
    </div>

    <div class="field">
      <span class="label">Receipt — レシート</span>
      <input id="receipt" name="receipt" type="file" accept="image/*" required>
      <div class="tiny">タップすると「写真を撮る」か「フォトライブラリ」を選べます。</div>
    </div>

    <button id="readBtn" type="submit">レシートを読み取る</button>
    <button type="button" class="secondary" style="margin-top:8px" onclick="manualEntry()">レシートなしで手入力</button>
    <div id="readStatus" class="status"></div>
  </form>

  <section id="resultCard" class="card hidden">
    <span class="label">Check — 読み取り結果</span>

    <div class="grid">
      <div class="field">
        <span class="label">日付</span>
        <input id="date" type="date">
      </div>
      <div class="field">
        <span class="label">合計金額</span>
        <input id="amount" type="number" min="1" inputmode="numeric">
      </div>
    </div>

    <div class="field">
      <span class="label">店名・内容</span>
      <input id="description" type="text" placeholder="例：ヨーカドー">
    </div>

    <div id="warning" class="warn hidden"></div>
    <div id="target" class="tiny"></div>
    <details id="ocrBox" class="hidden" style="margin-top:8px">
      <summary class="tiny" style="cursor:pointer">読み取った文字を見る</summary>
      <pre id="ocrText" style="white-space:pre-wrap;font-size:12px;color:#525252;background:#fafafa;border:1px solid var(--line);border-radius:10px;padding:10px;max-height:220px;overflow:auto"></pre>
    </details>
    <button id="saveBtn" type="button" onclick="save()">家計簿に登録</button>
    <button type="button" class="secondary" style="margin-top:8px" onclick="cancelEntry()">やめる</button>
    <div id="saveStatus" class="status"></div>
  </section>
  </div>
</main>

<script>
  let current = null;
  let hideTimer = null;

  function clearResult() {
    if (hideTimer) { clearTimeout(hideTimer); hideTimer = null; }
    current = null;
    document.getElementById('date').value = '';
    document.getElementById('amount').value = '';
    document.getElementById('description').value = '';
    document.getElementById('target').textContent = '';
    document.getElementById('warning').classList.add('hidden');
    document.getElementById('saveStatus').textContent = '';
    document.getElementById('ocrBox').classList.add('hidden');
    document.getElementById('saveBtn').disabled = false;
    document.getElementById('resultCard').classList.add('hidden');
  }

  function cancelEntry() {
    const fileId = current && current.receiptFileId;
    clearResult();
    document.getElementById('receiptForm').reset();
    document.getElementById('payerY').checked = true;
    document.getElementById('readStatus').textContent = '';
    if (fileId) google.script.run.cancelReceipt(fileId);
    document.getElementById('receiptForm').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function manualEntry() {
    clearResult();
    const payer = document.querySelector('input[name="payer"]:checked').value;
    const today = new Date();
    const iso = today.getFullYear() + '-' + String(today.getMonth() + 1).padStart(2, '0') + '-' + String(today.getDate()).padStart(2, '0');
    current = { payer: payer, receiptFileId: '', receiptUrl: '' };
    document.getElementById('date').value = iso;
    document.getElementById('target').textContent = '手入力 / ' + payer + '（日付の月のタブに登録されます）';
    document.getElementById('readStatus').textContent = '';
    document.getElementById('resultCard').classList.remove('hidden');
    setTimeout(() => document.getElementById('amount').focus(), 100);
  }

  function analyze(form) {
    const btn = document.getElementById('readBtn');
    const status = document.getElementById('readStatus');
    btn.disabled = true;
    status.textContent = '読み取り中…';
    clearResult();

    google.script.run
      .withSuccessHandler(data => {
        current = data;
        document.getElementById('date').value = data.date || '';
        document.getElementById('amount').value = data.amount || '';
        document.getElementById('description').value = data.description || '';
        document.getElementById('target').textContent = '登録先予定：' + data.detectedSheet + ' タブ / ' + data.payer;
        document.getElementById('ocrText').textContent = data.ocrText || '（読み取れませんでした）';
        document.getElementById('ocrBox').classList.remove('hidden');

        const warning = document.getElementById('warning');
        if (data.warning) {
          warning.textContent = data.warning;
          warning.classList.remove('hidden');
        } else {
          warning.classList.add('hidden');
        }

        document.getElementById('resultCard').classList.remove('hidden');
        status.textContent = '読み取り完了。内容だけ確認してください。';
        btn.disabled = false;
        setTimeout(() => document.getElementById('resultCard').scrollIntoView({ behavior: 'smooth', block: 'start' }), 50);
      })
      .withFailureHandler(err => {
        status.textContent = 'エラー：' + (err && err.message ? err.message : err);
        btn.disabled = false;
      })
      .analyzeReceipt(form);
  }

  function save() {
    if (!current) return;
    const btn = document.getElementById('saveBtn');
    const status = document.getElementById('saveStatus');
    btn.disabled = true;
    status.textContent = '登録中…';

    const payload = {
      payer: current.payer,
      date: document.getElementById('date').value,
      amount: document.getElementById('amount').value,
      description: document.getElementById('description').value,
      receiptFileId: current.receiptFileId,
      receiptUrl: current.receiptUrl
    };

    google.script.run
      .withSuccessHandler(res => {
        status.innerHTML = '<div class="ok">' + escapeHtml(res.message) + '</div>';
        btn.disabled = false;
        document.getElementById('receiptForm').reset();
        document.getElementById('payerY').checked = true;
        current = null;
        monthsLoaded = false;
        hideTimer = setTimeout(() => {
          hideTimer = null;
          clearResult();
          document.getElementById('readStatus').textContent = '';
          document.getElementById('receiptForm').scrollIntoView({ behavior: 'smooth', block: 'start' });
        }, 1500);
      })
      .withFailureHandler(err => {
        status.textContent = 'エラー：' + (err && err.message ? err.message : err);
        btn.disabled = false;
      })
      .saveReceipt(payload);
  }


  /* ---------- 閲覧 ---------- */
  let monthsLoaded = false;
  let currentMonth = null;

  function showTab(name) {
    document.getElementById('regPane').classList.toggle('hidden', name !== 'reg');
    document.getElementById('viewPane').classList.toggle('hidden', name !== 'view');
    document.getElementById('tabReg').classList.toggle('active', name === 'reg');
    document.getElementById('tabView').classList.toggle('active', name === 'view');
    if (name === 'view' && !monthsLoaded) loadMonths();
  }

  function loadMonths() {
    const status = document.getElementById('viewStatus');
    status.textContent = '読み込み中…';
    google.script.run
      .withSuccessHandler(res => {
        monthsLoaded = true;
        const sel = document.getElementById('monthSelect');
        sel.innerHTML = '';
        res.sheets.forEach(n => {
          const o = document.createElement('option');
          o.value = n; o.textContent = monthLabel(n);
          sel.appendChild(o);
        });
        sel.value = res.current;
        loadSummary(res.current);
      })
      .withFailureHandler(err => { status.textContent = 'エラー：' + (err && err.message ? err.message : err); })
      .listMonthSheets();
  }

  function loadSummary(name) {
    currentMonth = name;
    const status = document.getElementById('viewStatus');
    status.textContent = '読み込み中…';
    google.script.run
      .withSuccessHandler(d => {
        status.textContent = '';
        document.getElementById('summary').classList.remove('hidden');
        setMoney('kLeftover', d.leftover);
        setMoney('kReceive', d.shoheiReceive);
        setMoney('kBudget', d.budget);
        setMoney('kYumiko', d.yumikoTotal);
        setMoney('kShohei', d.shoheiTotal);
        setMoney('kDiff', d.diff);
        document.getElementById('kDiffNote').textContent =
          d.diff > 0 ? '翔平が ' + yen(d.diff) + ' 多く払っている' :
          d.diff < 0 ? 'ゆみこが ' + yen(-d.diff) + ' 多く払っている' : '同額';

        const sv = document.getElementById('savings');
        sv.textContent = d.savings
          ? '余り金の累計残高：' + yen(d.savings.balance) + '（' + d.savings.year + '年' + d.savings.month + '時点）'
          : '';

        const ft = document.getElementById('fixedTable');
        ft.innerHTML = d.fixed.map(f =>
          '<tr><td>' + escapeHtml(f.label) + '</td><td class="r">' + yen(f.amount) + '</td></tr>').join('');
        document.getElementById('fixedCard').classList.toggle('hidden', d.fixed.length === 0);

        const et = document.getElementById('entriesTable');
        et.innerHTML = d.entries.length
          ? d.entries.map(e =>
              '<tr><td><span class="tag ' + (e.payer === '翔平' ? 's' : 'y') + '">' + escapeHtml(e.payer) + '</span>' +
              escapeHtml(e.date) + '</td><td>' + escapeHtml(e.description || '') + '</td><td class="r">' + yen(e.amount) +
              '<button type="button" class="del" onclick="deleteEntry(' + e.row + ',\'' + e.payer + '\',' + e.amount + ',\'' + escapeHtml(e.description || '') + '\')">削除</button></td></tr>').join('')
          : '<tr><td>まだ登録がありません</td></tr>';
        document.getElementById('entriesCard').classList.remove('hidden');
      })
      .withFailureHandler(err => { status.textContent = 'エラー：' + (err && err.message ? err.message : err); })
      .getMonthSummary(name);
  }

  function deleteEntry(row, payer, amount, desc) {
    if (!currentMonth) return;
    if (!confirm('この明細を削除しますか？\n' + payer + ' / ' + desc + ' / ' + yen(amount))) return;
    const status = document.getElementById('viewStatus');
    status.textContent = '削除中…';
    google.script.run
      .withSuccessHandler(res => {
        status.textContent = res.message || '削除しました。';
        loadSummary(currentMonth);
      })
      .withFailureHandler(err => { status.textContent = 'エラー：' + (err && err.message ? err.message : err); })
      .deleteEntry({ sheetName: currentMonth, payer: payer, row: row, amount: amount });
  }

  function setMoney(id, v) {
    const el = document.getElementById(id);
    el.textContent = v === null || v === undefined ? '—' : yen(v);
    el.classList.toggle('minus', typeof v === 'number' && v < 0);
  }
  function yen(v) { return '¥' + Math.round(Number(v) || 0).toLocaleString('ja-JP'); }
  function monthLabel(n) {
    const m = String(n).match(/^(\d{2})(\d{1,2})$/);
    return m ? '20' + m[1] + '年' + Number(m[2]) + '月' : n;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
  }
</script>
</body>
</html>
