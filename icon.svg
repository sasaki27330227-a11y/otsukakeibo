<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <clipPath id="r"><rect width="512" height="512" rx="112"/></clipPath>
  </defs>
  <g clip-path="url(#r)">
    <!-- cream paper -->
    <rect width="512" height="512" fill="#F3ECDC"/>
    <!-- subtle paper grain -->
    <rect width="512" height="512" fill="#000" opacity="0.02"/>
    <!-- top masthead band -->
    <rect x="0" y="0" width="512" height="118" fill="#1E3A8A"/>
    <text x="256" y="86" text-anchor="middle" font-family="TeX Gyre Adventor, Poppins, sans-serif" font-weight="700" font-size="66" letter-spacing="6" fill="#F3ECDC">KAKEIBO</text>
    <!-- red sticker -->
    <g transform="translate(408 150) rotate(12)">
      <circle r="58" fill="#D7263D"/>
      <text y="-4" text-anchor="middle" font-family="TeX Gyre Adventor, Poppins, sans-serif" font-weight="700" font-size="20" letter-spacing="2" fill="#F3ECDC">DAILY</text>
      <text y="22" text-anchor="middle" font-family="TeX Gyre Adventor, Poppins, sans-serif" font-weight="700" font-size="20" letter-spacing="2" fill="#F3ECDC">NOTES</text>
    </g>
    <!-- big yen -->
    <text x="238" y="392" text-anchor="middle" font-family="TeX Gyre Bonum, DejaVu Serif, serif" font-weight="700" font-style="italic" font-size="300" fill="#1E3A8A">¥</text>
    <!-- yellow underline swash -->
    <rect x="96" y="404" width="270" height="18" rx="9" fill="#F2B705"/>
    <!-- bottom stripes -->
    <rect x="0" y="470" width="512" height="14" fill="#D7263D"/>
    <rect x="0" y="484" width="512" height="14" fill="#1E3A8A"/>
    <rect x="0" y="498" width="512" height="14" fill="#F2B705"/>
    <!-- small caption -->
    <text x="40" y="452" font-family="TeX Gyre Adventor, Poppins, sans-serif" font-weight="700" font-size="17" letter-spacing="3" fill="#1E3A8A">RECEIPT &amp; SAVINGS</text>
  </g>
</svg>
