<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c1c1e"/>
      <stop offset="1" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5d78a"/>
      <stop offset="1" stop-color="#c9973b"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e8e8e8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- subtle highlight -->
  <radialGradient id="glow" cx="0.25" cy="0.1" r="0.8"><stop offset="0" stop-color="#fff" stop-opacity="0.09"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>
  <!-- receipt -->
  <g filter="url(#shadow)" transform="translate(256 256) rotate(-8) translate(-256 -256)">
    <path fill="url(#paper)" d="M166 118 h180 a10 10 0 0 1 10 10 v250 l-19 -14 -19 14 -19 -14 -19 14 -19 -14 -19 14 -19 -14 -19 14 -19 -14 -19 14 v-250 a10 10 0 0 1 10 -10z"/>
    <rect x="196" y="160" width="60" height="10" rx="5" fill="#1c1c1e" opacity="0.85"/>
    <rect x="196" y="192" width="120" height="8" rx="4" fill="#1c1c1e" opacity="0.28"/>
    <rect x="196" y="214" width="96" height="8" rx="4" fill="#1c1c1e" opacity="0.28"/>
    <rect x="196" y="236" width="110" height="8" rx="4" fill="#1c1c1e" opacity="0.28"/>
    <rect x="196" y="272" width="120" height="2" fill="#1c1c1e" opacity="0.25"/>
    <!-- yen mark -->
    <text x="316" y="336" text-anchor="end" font-family="-apple-system,'Helvetica Neue',Arial,sans-serif" font-weight="800" font-size="60" fill="url(#gold)">¥</text>
  </g>
</svg>
