<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111111" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="家計簿" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./icon-192.png" />
  <title>家計簿レシート登録</title>
  <style>
    :root{
      color-scheme: light;
      --bg:#f5f5f4; --panel:#fff; --ink:#171717; --muted:#737373;
      --line:#e5e5e5; --accent:#171717; --danger:#b91c1c;
    }
    *{box-sizing:border-box}
    html,body{margin:0;height:100%;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}
    body{min-height:100dvh;overflow:hidden}
    .app{height:100dvh;display:flex;flex-direction:column}
    header{
      flex:0 0 auto;
      padding:calc(10px + env(safe-area-inset-top)) 14px 10px;
      display:flex;align-items:center;justify-content:space-between;gap:10px;
      background:rgba(255,255,255,.94);border-bottom:1px solid var(--line);
      backdrop-filter:blur(12px)
    }
    .brand{display:flex;align-items:center;gap:10px;min-width:0}
    .mark{
      width:38px;height:38px;border-radius:12px;background:#111;color:#fff;
      display:grid;place-items:center;font-size:20px;flex:none
    }
    .brand h1{font-size:16px;line-height:1.2;margin:0}
    .brand p{font-size:11px;color:var(--muted);margin:3px 0 0}
    .settings{
      border:1px solid var(--line);background:#fff;border-radius:11px;
      padding:9px 11px;font-size:14px;font-weight:700
    }
    #frameWrap{flex:1;min-height:0;position:relative}
    iframe{width:100%;height:100%;border:0;background:#fff}
    .setup{
      position:absolute;inset:0;display:grid;place-items:center;padding:20px;
      background:var(--bg);overflow:auto
    }
    .card{
      width:min(100%,520px);background:var(--panel);border:1px solid var(--line);
      border-radius:20px;padding:20px;box-shadow:0 12px 38px rgba(0,0,0,.06)
    }
    .card h2{font-size:22px;margin:0 0 7px}
    .card p{font-size:14px;line-height:1.65;color:#525252;margin:0 0 18px}
    label{display:block;font-size:12px;font-weight:800;color:#525252;margin:0 0 8px}
    input{
      width:100%;font-size:16px;border:1px solid var(--line);border-radius:12px;
      padding:13px 12px;background:#fff
    }
    .row{display:grid;grid-template-columns:1fr;gap:10px;margin-top:12px}
    button.primary{
      width:100%;border:0;border-radius:13px;padding:14px 16px;
      background:var(--accent);color:#fff;font-size:16px;font-weight:800
    }
    button.link{
      width:100%;border:1px solid var(--line);border-radius:13px;padding:12px 16px;
      background:#fff;color:var(--ink);font-size:14px;font-weight:700
    }
    .error{color:var(--danger);font-size:13px;line-height:1.5;margin-top:10px;min-height:1.5em}
    .hint{font-size:12px!important;color:var(--muted)!important;margin-top:10px!important}
    .hidden{display:none!important}
  </style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <img class="mark" src="./icon-192.png" alt="" style="border-radius:10px;object-fit:cover">
      <div>
        <h1>家計簿</h1>
        <p>レシートから自動入力</p>
      </div>
    </div>
    <button class="settings" type="button" id="settingsBtn">設定</button>
  </header>

  <div id="frameWrap">
    <iframe id="gasFrame" class="hidden" title="レシート登録"></iframe>

    <div id="setup" class="setup">
      <div class="card">
        <h2>最初の1回だけ設定</h2>
        <p>
          Google Apps Scriptをウェブアプリとしてデプロイしたときの
          <strong>/exec</strong> で終わるURLを貼ってください。
          URLはこのスマホ内にだけ保存され、GitHubには保存されません。
        </p>

        <label for="gasUrl">Apps Script URL</label>
        <input
          id="gasUrl"
          type="url"
          inputmode="url"
          autocomplete="off"
          placeholder="https://script.google.com/macros/s/...../exec"
        />

        <div class="row">
          <button class="primary" type="button" id="saveBtn">保存して家計簿を開く</button>
          <button class="link hidden" type="button" id="cancelBtn">キャンセル</button>
        </div>

        <div id="error" class="error"></div>
        <p class="hint">
          スプレッドシート自体は今まで通り直接開いて手入力できます。
          この画面は「レシート入力」を追加するだけです。
        </p>
      </div>
    </div>
  </div>
</div>

<script>
  const KEY = 'receiptKakeiboGasUrl';
  const DEFAULT_GAS_URL = 'https://script.google.com/macros/s/AKfycbyJQWcYmwG0wKCPN_ij5Onjf0DH222nyz4mEXaOpHPisOidKjIYbAMKrHhpOQU2Ojci/exec';
  const setup = document.getElementById('setup');
  const frame = document.getElementById('gasFrame');
  const urlInput = document.getElementById('gasUrl');
  const errorBox = document.getElementById('error');
  const cancelBtn = document.getElementById('cancelBtn');

  function isValidGasUrl(value) {
    try {
      const u = new URL(value);
      return u.protocol === 'https:' &&
             u.hostname === 'script.google.com' &&
             /^\/macros\/s\/[^/]+\/exec$/.test(u.pathname);
    } catch (_) {
      return false;
    }
  }

  function openApp(url) {
    frame.src = url;
    frame.classList.remove('hidden');
    setup.classList.add('hidden');
  }

  function showSetup(canCancel = false) {
    const current = localStorage.getItem(KEY) || '';
    urlInput.value = current;
    errorBox.textContent = '';
    setup.classList.remove('hidden');
    cancelBtn.classList.toggle('hidden', !canCancel);
  }

  document.getElementById('saveBtn').addEventListener('click', () => {
    const value = urlInput.value.trim();
    if (!isValidGasUrl(value)) {
      errorBox.textContent = 'URLを確認してください。Apps Scriptの「ウェブアプリURL（/exec）」を貼ります。';
      return;
    }
    localStorage.setItem(KEY, value);
    openApp(value);
  });

  document.getElementById('settingsBtn').addEventListener('click', () => showSetup(true));
  cancelBtn.addEventListener('click', () => {
    const current = localStorage.getItem(KEY);
    if (current) openApp(current);
  });

  const saved = localStorage.getItem(KEY) || DEFAULT_GAS_URL;
  if (saved && isValidGasUrl(saved)) {
    openApp(saved);
  } else {
    showSetup(false);
  }

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    });
  }
</script>
</body>
</html>
